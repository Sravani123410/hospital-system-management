```html
{% extends "base.html" %}

{% if doctor %}
    {% set page_title = "Edit Doctor" %}
{% else %}
    {% set page_title = "Add Doctor" %}
{% endif %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}

<h1>{{ page_title }}</h1>

<form
    method="POST"
    action="{% if doctor %}
                {{ url_for('update_doctor', id=doctor.id) }}
            {% else %}
                {{ url_for('create_doctor') }}
            {% endif %}"
>

    {% if doctor %}
        <input
            type="hidden"
            name="_method"
            value="PUT"
        >
    {% endif %}

    <label>Name</label>

    <input
        type="text"
        name="name"
        value="{{ doctor.name if doctor else '' }}"
        required
    >

    <label>Specialization</label>

    <input
        type="text"
        name="specialization"
        value="{{ doctor.specialization if doctor else '' }}"
        placeholder="Example: Cardiologist"
        required
    >

    <br><br>

    <button
        type="submit"
        class="btn btn-success"
    >
        {% if doctor %}
            Update Doctor
        {% else %}
            Add Doctor
        {% endif %}
    </button>

    <a
        href="{{ url_for('doctors') }}"
        class="btn"
    >
        Cancel
    </a>

</form>

{% endblock %}
```
