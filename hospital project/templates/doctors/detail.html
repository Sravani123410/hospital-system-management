```html
{% extends "base.html" %}

{% block title %}Doctor Details{% endblock %}

{% block content %}

<h1>Doctor Details</h1>

<div class="detail-box">

    <p>
        <strong>ID:</strong>
        {{ doctor.id }}
    </p>

    <p>
        <strong>Name:</strong>
        {{ doctor.name }}
    </p>

    <p>
        <strong>Specialization:</strong>
        {{ doctor.specialization }}
    </p>

</div>

<br>

<a
    href="{{ url_for('edit_doctor', id=doctor.id) }}"
    class="btn btn-warning"
>
    Edit Doctor
</a>

<a
    href="{{ url_for('doctors') }}"
    class="btn"
>
    Back
</a>

{% endblock %}
```
