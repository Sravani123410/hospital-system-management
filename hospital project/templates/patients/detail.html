```html
{% extends "base.html" %}

{% block title %}Patient Details{% endblock %}

{% block content %}

<h1>Patient Details</h1>

<div class="detail-box">

    <p>
        <strong>ID:</strong>
        {{ patient.id }}
    </p>

    <p>
        <strong>Name:</strong>
        {{ patient.name }}
    </p>

    <p>
        <strong>Age:</strong>
        {{ patient.age }}
    </p>

    <p>
        <strong>Gender:</strong>
        {{ patient.gender }}
    </p>

    <p>
        <strong>Contact:</strong>
        {{ patient.contact }}
    </p>

</div>

<br>

<a
    href="{{ url_for('edit_patient', id=patient.id) }}"
    class="btn btn-warning"
>
    Edit Patient
</a>

<a
    href="{{ url_for('patients') }}"
    class="btn"
>
    Back
</a>

{% endblock %}
```
