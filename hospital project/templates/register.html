{% extends "base.html" %}

{% block title %}Register Admin{% endblock %}

{% block content %}

<h1>Register Admin</h1>

<form method="POST" style="max-width: 500px; margin: auto;">

    <label>Username</label>

    <input
        type="text"
        name="username"
        required
    >

    <label>Password</label>

    <input
        type="password"
        name="password"
        required
    >

    <br><br>

    <button
        type="submit"
        class="btn btn-success"
    >
        Register Admin
    </button>

</form>

{% endblock %}
